name: Build binaries on Release
run-name: "Build TrackForge binaries for ${{ github.event.release.name }}"

on:
  release:
    types: [ published ]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: windows
            arch: x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.os }}-${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync runtime dependencies
        run: uv sync --no-dev

      - name: Set version from release tag
        if: github.event.release.tag_name != ''
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          sed -i -E "s|^version = .*|version = \"${VER}\"|" pyproject.toml
          echo "pyproject version set to ${VER}"

      - name: Build and stage release package
        run: uv run --with pyinstaller python build.py

      - name: Read package version
        id: pkg
        run: |
          set -euo pipefail
          VER="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Zip package (Linux)
        if: runner.os == 'Linux'
        run: zip -r "trackforge-${{ matrix.os }}-${{ matrix.arch }}.zip" "release-v${{ steps.pkg.outputs.version }}"

      - name: Zip package (Windows)
        if: runner.os == 'Windows'
        run: 7z a -tzip "trackforge-${{ matrix.os }}-${{ matrix.arch }}.zip" "release-v${{ steps.pkg.outputs.version }}"

      - name: Upload zip to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: trackforge-${{ matrix.os }}-${{ matrix.arch }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
