[project]
name = "trackforge"
version = "1.0.1"
description = "CLI tool for re-encoding and downmixing the audio tracks of media files."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.13.0",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 250
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "UP", "RUF"]
